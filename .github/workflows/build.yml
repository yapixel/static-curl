name: Build Static Curl for Android (ARM64)

on:
  workflow_dispatch: 

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make perl wget tar xz-utils

      - name: Build Curl with Zig
        run: |
          CURL_VERSION="8.21.0"
          TARGET="aarch64-linux-musl"

          export CC="zig cc -target $TARGET"
          export CXX="zig c++ -target $TARGET"
          export AR="zig ar"
          export RANLIB="zig ranlib"

          wget https://curl.se/download/curl-${CURL_VERSION}.tar.gz
          tar xzf curl-${CURL_VERSION}.tar.gz
          cd curl-${CURL_VERSION}

          ./configure \
            --host="aarch64-linux" \
            --disable-shared \
            --enable-static \
            --enable-ipv6 \
            --enable-unix-sockets \
            --disable-ldap \
            --disable-docs \
            --disable-manual \
            --without-libpsl \
            --without-ssl \
            LDFLAGS="-static"

          make -j$(nproc)

          cp src/curl ../curl-android-arm64
          cd ..

          # 修正 objcopy 的输入输出参数格式
          zig objcopy --strip-all curl-android-arm64 curl-android-arm64

          ls -lh curl-android-arm64
          file curl-android-arm64

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: curl-android-arm64
          path: curl-android-arm64
